
name: Build Little Explorers APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q Little_Explorers_Android_Phone_Ready.zip -d extracted
          cd extracted/LittleExplorersAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Little-Explorers-APK
          path: extracted/LittleExplorersAndroid/app/build/outputs/apk/debug/app-debug.apk
          
